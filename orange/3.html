<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12131a"><title>Moderátor na smene | Digitálna odolnosť</title>
<style>
:root{color-scheme:dark;--bg:#12131a;--panel:#1c1e28;--card:#242632;--ink:#fbf7f2;--sub:#bbbccc;--line:#414454;--lime:#d9fa83;--accent:#ffba76;--warm:#ffc5af;--good:#c9f689;font:16px/1.42 system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--ink);background:radial-gradient(ellipse at 88% 2%,#392b44,transparent 48%),radial-gradient(ellipse at 0% 75%,#202d2d,transparent 40%),var(--bg)}p,h1,h2,h3{margin:0}button{cursor:pointer;font:inherit;color:inherit;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,summary:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.wrap{width:min(1160px,100% - 40px);margin:auto}.mast{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.1em;font-size:.82rem}.brand svg{width:34px;height:34px}.label,.eyebrow,.chip{font-family:ui-monospace,Consolas,monospace;font-weight:800;letter-spacing:.1em;font-size:.73rem}.eyebrow{color:var(--accent);text-transform:uppercase}.muted,.label{color:var(--sub)}.label{text-transform:uppercase}main{padding:25px 0 32px}footer{font-size:.78rem;color:var(--sub);padding:14px 0 22px;border-top:1px solid var(--line)}.fade{animation:appear .35s both ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.btn{min-height:44px;padding:9px 15px;border-radius:10px;background:#292c3b;border:1px solid var(--line);font-weight:800}.btn:hover:not(:disabled){filter:brightness(1.15)}.primary{background:var(--lime);color:#1a2116;border-color:transparent}.subtle{background:transparent}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.77fr);gap:26px;align-items:center;padding:clamp(20px,4.6vw,52px);border:1px solid var(--line);background:radial-gradient(ellipse at 90% 40%,#3c3344,#21232e 59%);border-radius:25px;overflow:hidden}.hero h1,.big{font-size:clamp(2.8rem,6.4vw,6.1rem);font-weight:950;letter-spacing:-.077em;line-height:.98;margin:11px 0 18px}.hero h1 em{font-style:normal;color:var(--lime);display:block}.hero p{max-width:47ch;color:#e0dce6}.stats-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.chip{display:inline-flex;align-items:center;border:1px solid #575061;background:#292635;color:#eee5f4;border-radius:50px;padding:5px 9px;letter-spacing:.035em}.hero-art{position:relative}.hero-art .phone{max-width:290px;margin:auto;transform:rotate(4deg)}.hero-art .thread{padding-bottom:10px}.halo{position:absolute;width:100%;aspect-ratio:1;top:8%;left:0;border-radius:50%;border:1px solid #ba9cd875;box-shadow:0 0 80px #ae72cf45,inset 0 0 70px #a967c140;background:repeating-radial-gradient(circle,transparent 0 34px,#a58ab32b 35px 36px)}.sticker{position:absolute;right:0;bottom:16%;transform:rotate(-8deg);background:var(--lime);color:#20291b;padding:8px 12px;border-radius:6px;font-size:.77rem;font-weight:900;box-shadow:0 6px 18px #15141b8c}.rules{margin-top:15px;padding:18px 20px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.rules summary{cursor:pointer;font-weight:850}.rules h3{font-size:1rem;margin:12px 0 5px}.rules ol,.rules ul{padding-left:1.35rem;margin:8px 0}.rules li{padding:3px 0;color:#e2dfeb}.rules p{font-size:.88rem;margin-top:9px}.phone{width:100%;max-width:405px;position:relative;margin:0 auto;padding:7px;border:1px solid #8c8d9e;border-radius:33px;background:linear-gradient(143deg,#9696a4,#20212a 13%,#6a6d80 42%,#1f222a 75%,#9b9aa7);box-shadow:0 17px 38px #0009,inset 0 0 0 2px #6d6f7a,inset 0 0 0 4px #0e0f14}.phone::before,.phone::after{content:"";position:absolute;border-radius:3px;background:linear-gradient(90deg,#83858e,#323341);width:4px;z-index:-1}.phone::before{height:54px;left:-4px;top:101px}.phone::after{height:45px;right:-4px;top:121px}.screen{overflow:hidden;border-radius:26px;border:1px solid #17171c;background:#0f1117}.statusbar{height:39px;padding:9px 15px;display:flex;justify-content:space-between;position:relative;font-size:.69rem;font-weight:700;color:#e8e8ef}.camera{position:absolute;top:7px;left:50%;width:81px;height:20px;transform:translateX(-50%);border:1px solid #252630;background:#040506;border-radius:20px}.camera::after{content:"";position:absolute;right:8px;top:6px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 66% 23%,#6e7d99,#212732 38%,#0c0d11 75%)}.phone-app{display:flex;justify-content:space-between;align-items:center;padding:5px 13px 10px;font-size:.78rem;font-weight:900}.phone-app span:last-child{color:var(--accent);font-size:.7rem}.clip{position:relative;background:#2e3442;aspect-ratio:16/9;overflow:hidden}.clip img{width:100%;height:100%;display:block;object-fit:cover}.clip-tag{position:absolute;top:9px;left:9px;background:#191c29e8;padding:3px 6px;border-radius:4px;font:700 .64rem ui-monospace,monospace;letter-spacing:.08em}.clip-tag::before{content:"● ";color:var(--accent)}.motion{position:absolute;right:7px;bottom:7px;min-height:34px;padding:4px 8px;background:#151824ed;border:1px solid #8990a8;border-radius:7px;font-size:.7rem;font-weight:760}.phone-copy{padding:10px 12px 8px}.phone-copy b{display:block;font-size:.93rem}.phone-copy p{font-size:.74rem;margin:4px 0;color:#d9d5e1}.phone-copy .handle{color:var(--accent);font-size:.7rem}.thread{border-top:1px solid #323543;padding:9px 9px 3px}.thread-head{display:flex;justify-content:space-between;gap:8px;padding:0 3px 6px;color:#d9d4e1;font-size:.7rem;font-weight:800}.msg{display:flex;gap:7px;align-items:flex-start;background:#1c1f29;border:1px solid #323645;border-radius:8px;padding:6px 7px;margin:4px 0;text-align:left;animation:appear .28s both}.msg.current{border-color:var(--accent);background:#272530}.avatar{width:25px;height:25px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--avatar,#bfaef0);color:#1b2330;font-size:.65rem;font-weight:950}.msg b{font-size:.67rem;color:#ded8e4}.msg p{font-size:.74rem;line-height:1.34;margin:2px 0}.msg small{font-size:.63rem;color:#e4e0ed;display:block;margin-top:3px}.msg .badge{color:var(--accent);font-weight:800}
.thread .comment-card{width:100%;min-height:60px;cursor:pointer;transition:background .17s,border-color .17s}
.thread .comment-card:hover{background:#303241;border-color:var(--accent)}
.comment-card .comment-copy{min-width:0;display:block}
.comment-card .comment-text{display:block;color:var(--ink);font-size:.82rem;line-height:1.38;margin:3px 0}
.comment-card.is-done{background:#171b23;border-color:#434959}
.comment-card.current{background:#2f2936;border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.comment-card .done-label{color:#c9ef9b}
.thread .thread-bonus{display:block;width:100%;margin:8px 0 4px;font-size:.82rem}
.desk .tip-box{margin-top:14px;border:1px dashed #5d6474;border-radius:10px;padding:12px;color:var(--sub);font-size:.89rem}
.desk h1:focus,.feedback:focus{outline:none}.homebar{height:4px;width:91px;background:#d9d9df;margin:8px auto;border-radius:8px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.progress{display:flex;gap:4px;margin-top:5px}.progress i{width:16px;height:5px;background:#444452;border-radius:5px}.progress i.done{background:#87b566}.progress i.current{background:var(--lime);box-shadow:0 0 10px #d9fa8370}.toolbar-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.workspace{display:grid;grid-template-columns:minmax(295px,.75fr) minmax(0,1fr);gap:clamp(15px,4vw,45px);align-items:start}.desk{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:clamp(15px,3vw,26px);min-width:0}.desk h1{font-size:clamp(1.7rem,4vw,2.75rem);line-height:1.04;letter-spacing:-.045em;margin:7px 0 13px}.desk blockquote{border-left:3px solid var(--accent);background:#262632;padding:10px 12px;margin:12px 0 14px;border-radius:0 8px 8px 0;font-size:1rem}.desk h2{font-size:1rem;margin:13px 0 7px}.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.picks.actions-pick{grid-template-columns:repeat(3,minmax(0,1fr))}.pick{background:#262935;border:1px solid #4a4c60;border-radius:9px;min-height:52px;padding:7px 9px;text-align:left;font-size:.88rem;font-weight:780;line-height:1.2}.pick small{display:block;margin-top:4px;font-size:.69rem;font-weight:500;color:#d4d3df}.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#38313d}.pick:hover:not(:disabled){border-color:var(--accent)}.feedback{border-radius:12px;background:#252936;border:1px solid #56626e;padding:13px;margin-top:13px}.feedback h2{margin:0 0 5px}.feedback p{font-size:.9rem;margin:7px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.72rem;font-weight:850;border-radius:10px;padding:4px 7px;background:#413039;color:#ffe0d5}.tag.ok{background:#36492e;color:#e5ffba}.bonus-picks{display:grid;gap:7px;margin-top:12px}.bonus-picks .pick{min-height:45px}.helper{color:var(--sub);font-size:.79rem;margin-top:10px}.hand,.result{max-width:800px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,38px)}.hand .big,.result .big{font-size:clamp(2.25rem,5.8vw,4.25rem)}.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:7px;margin:15px 0}.total{border:1px solid var(--line);background:#282b39;border-radius:10px;padding:10px}.total b{color:var(--lime);display:block;font-size:1.45rem}.total span{color:var(--sub);font-size:.77rem}.case-review{margin:6px 0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#212330}.case-review summary{cursor:pointer;font-weight:750}.case-review p{font-size:.84rem;margin:9px 0}.review-row{border-bottom:1px solid var(--line);padding:5px 0}.pop{width:min(630px,100% - 20px);max-height:90dvh;background:var(--panel);color:var(--ink);border:1px solid #77798c;border-radius:15px;padding:19px}.pop::backdrop{background:#0a0a11ca}.pop .rules{padding:0;border:0;margin:0}.pop h2{margin-bottom:6px}.screen button[data-thread-jump]{width:100%;text-align:left;background:transparent;border:0;padding:3px 0;color:var(--accent);font-size:.72rem;font-weight:800}
@media(max-width:820px){.workspace{gap:15px}.picks.actions-pick{grid-template-columns:1fr}.picks.actions-pick .pick{min-height:41px}.wrap{width:calc(100% - 26px)}}
@media(max-width:650px){.hero,.workspace{grid-template-columns:1fr}.hero{padding:20px;gap:21px}.hero-art .phone{max-width:240px;transform:rotate(2deg)}.hero-art .clip{aspect-ratio:16/7}.hero-art .thread{display:none}.hero-art .sticker{right:7%;bottom:6%}.mast{min-height:57px}.mast .label{font-size:.57rem}.toolbar{gap:5px}.toolbar-right{gap:4px}.toolbar-right .btn{padding:7px 9px;font-size:.75rem}.toolbar .chip{font-size:.61rem}.progress i{width:9px}.phone{max-width:390px}.desk h1{font-size:1.65rem}.picks.actions-pick{grid-template-columns:repeat(3,minmax(0,1fr))}.picks.actions-pick .pick{font-size:.76rem;padding:6px}.workspace{gap:13px}}
@media(max-width:370px){.picks.actions-pick{grid-template-columns:1fr}.toolbar-right .chip{display:none}.wrap{width:calc(100% - 16px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style></head>

<main class="wrap" id="app"></main><footer class="wrap">Školský simulátor diskusie · Videá, účty aj komentáre sú fiktívne.</footer><dialog id="rules-dialog" class="pop" aria-labelledby="rules-title"></dialog>
<script>
"use strict";
const C=(user,text,t,a,why)=>({user,text,t,a,why});
const S=(title,handle,caption,accent,comments,bonus)=>({title,handle,caption,accent,comments,bonus});
const scenes=[
S('Skejty po škole','@skatecrew','Nová rampa. Prvý čistý prejazd.','#ffba76',[
C('nia.flip','Mne sa viac páčia videá bez hudby.','n','keep','Nia opisuje svoj vkus. Nikomu nenadáva a nemusí vysvetľovať, prečo má radšej ticho.'),
C('loop.viktor','Pri skoku hudba prekryla dopad. Necháte tam nabudúce aj zvuk dosky?','k','keep','Komentár ukazuje konkrétny moment a navrhuje úpravu zvuku. Aj kritika zostáva v diskusii.'),
C('drop.eli','Ty si trápny, radšej už nič netoč.','u','warn','Veta útočí na človeka a nehovorí, čo sa dá vo videu zlepšiť. Podľa pravidiel hry ide o prvú urážku, preto upozornenie.')],
{q:'Ako dať spätnú väzbu, ak mi vadí hlasná hudba?',o:['„Vypni to, kto by toto počúval?“','„Pri dopade by som stíšil hudbu, aby bolo počuť dosku.“','„Lepší človek by vybral lepšiu pesničku.“'],ok:1,why:'Konkrétny moment a návrh pomáhajú autorovi niečo zmeniť.'}),
S('Tanečná skúška','@stage.lab','Posledný nácvik pred vystúpením.','#f69bc3',[
C('step.sam','Druhý prechod je trochu mimo rytmu. Pomohol by pomalší nácvik.','k','keep','Kritika môže znieť nepríjemne. Sam však pomenoval konkrétny prechod a navrhol riešenie.'),
C('echo.b','Ľudia s takým pôvodom do našej tanečnej skupiny nepatria.','h','flag','Vylúčenie je založené na pôvode ľudí. Je to útok na skupinovú identitu; podľa pravidiel hry ho nahlásime.'),
C('sara.moves','Mne by k tejto choreografii sadla iná pesnička.','n','keep','Ide o osobnú preferenciu. Nesúhlas s výberom hudby je v poriadku.')],
{q:'Prečo je veta o tom, kto smie patriť do tanečnej skupiny, útokom na skupinovú identitu?',o:['Je krátky.','Hovorí o tanečnej skupine.','Vylučuje ľudí kvôli ich pôvodu.'],ok:2,why:'Rozhoduje, že dôvodom vylúčenia je pôvod, teda súčasť identity.'}),
S('Robot na čiare','@robotika.lab','Náš robot prešiel trať na tretí pokus.','#73e3e4',[
C('mato.build','Na konci robot schádza z čiary. Snímač by som skúsil dať nižšie.','k','keep','Je jasné, čo žiak pozoroval a čo navrhuje skúsiť. Hodnotí prácu, nie autora.'),
C('zim.01','Toto robil niekto, kto na nič nemá.','u','warn','Text zhadzuje autora. Nedáva žiadnu konkrétnu spätnú väzbu k robotovi.'),
C('code.ema','Viac ma bavia roboti, čo zvládnu prekážky.','n','keep','Je to vyjadrenie záujmu, nie útok na členov tímu.')],
{q:'Čo odlišuje návrh upraviť snímač od vety „Toto robil niekto, kto na nič nemá“?',o:['Prvý hovorí o správaní robota, druhý zhadzuje autora.','Prvý obsahuje viac slov.','Prvý komentár musí byť pravdivý, lebo je slušný.'],ok:0,why:'Vecná kritika sa dá posúdiť podľa konkrétneho pozorovania. Slušný návrh nemusí byť automaticky technicky správny.'}),
S('Florbalové finále','@hala.match','Rozhodujúca prihrávka v poslednej minúte.','#f5d778',[
C('arena.fan','Po tvojej prihrávke už radšej nikdy nehraj. Si neschopný.','u','warn','Komentár začína pri výkone, ale končí útokom na človeka. Je to prvá osobná urážka.'),
C('offside.l','Hráči s týmto zdravotným znevýhodnením by mali byť z tímov vylúčení.','h','flag','Žiada vylúčenie ľudí pre zdravotné znevýhodnenie, nie hodnotenie konkrétnej prihrávky.'),
C('lea.floor','Na zábere je vidieť, že pravé krídlo bolo voľné. Prihrávka doprava by otvorila priestor.','k','keep','Komentár pomenúva konkrétnu situáciu v hre. Kritizovať prihrávku je v poriadku.')],
{q:'Čo môžeš urobiť ako svedok po nahlásení útoku?',o:['Rozposlať komentár do ďalších skupín.','Súkromne podporiť človeka, ktorého sa útok dotkol.','Zverejniť meno a kontakt autora útoku.'],ok:1,why:'Súkromná podpora pomáha bez toho, aby sa útočný komentár šíril ďalej.'}),
S('Školský podcast','@mikrofon.on','Krátky rozhovor z nahrávacieho štúdia.','#b7abff',[
C('tin.audio','Hostku skoro nepočuť v druhej polovici. Skúste vyrovnať hlasitosť oboch mikrofónov.','k','keep','Je to konkrétna pripomienka k nahrávke. Tím ju môže vyskúšať.'),
C('low.voice','Tá hostka je nula. Vravel som to už pod predošlými dvoma videami.','u','flag','Stále je to osobná urážka. Z kontextu je zrejmé, že útok na tú istú osobu sa opakuje; v tejto hre ho nahlásime.'),
C('iris.fm','Takéto dlhšie rozhovory ma nebavia.','n','keep','Žiak vyjadruje svoj vkus. Odpoveď nemusí byť pochvala, aby mohla v diskusii ostať.')],
{q:'Prečo je nahlásenie komentára „Tá hostka je nula“ v tejto situácii primerané?',o:['Každý záporný komentár treba nahlásiť.','Je napísaný pod školským videom.','Je to opakovaný osobný útok na tú istú osobu.'],ok:2,why:'Opakovanie mení vážnosť situácie aj vtedy, keď typ komentára ostáva osobná urážka.'}),
S('Výstava v chodbe','@atelier.patro','Tri návrhy plagátov na školskú výstavu.','#a8e583',[
C('pixel.d','Za mňa vyhráva fialový plagát.','n','keep','Je to výber podľa vlastného vkusu. Nepotrebuje zásah.'),
C('frame.k','Ľudí s touto vierou by na výstavu nemali pustiť.','h','flag','Komentár vylučuje ľudí pre ich vieru. Kritika plagátu s tým nemá nič spoločné.'),
C('mira.art','Nadpis na zelenom plagáte z diaľky splýva s pozadím. Tmavší text by sa čítal lepšie.','k','keep','Komentár opisuje viditeľný problém a navrhuje konkrétnu úpravu kontrastu.')],
{q:'Ktoré upozornenie sa odvoláva na pravidlo bez útoku na autora?',o:['„Hodnoťme plagáty. Ľudí z výstavy nevylučujeme kvôli ich viere.“','„Si hrozný človek, už nikdy nepíš.“','„Zakážme všetky komentáre k výstave.“'],ok:0,why:'Veta pomenúva pravidlo a správanie. V samotnej hre pri útoku na skupinu volíme nahlásenie, aj keď vieme pravidlo pokojne vysvetliť.'}),
S('Turnaj na konzole','@lobby.skola','Zostrih posledného kola herného turnaja.','#8cbaff',[
C('combo.max','Úvod je zbytočne dlhý. Zostrih by bol svižnejší, keby začal poslednou minútou.','k','keep','„Zbytočne dlhý“ znie priamo, ale kritika sa týka úvodu a obsahuje návrh úpravy.'),
C('gg.vera','Túto hru by som si nevybrala. Viac ma bavia preteky.','n','keep','Vera sa vyjadruje k výberu hry a k tomu, čo ju baví.'),
C('lag.n','Organizátor je úplný blbec.','u','warn','Komentár útočí na organizátora ako na človeka. Nehovorí, čo by sa na turnaji dalo zlepšiť.')],
{q:'Ako reagovať na ostrú, ale konkrétnu kritiku úvodu?',o:['Nahlásiť ju len preto, že autor použil slovo „zbytočne“.','Ponechať ju; rozpráva o zostrihu a navrhuje zmenu.','Upozorniť, že sú povolené len pochvaly.'],ok:1,why:'Pravidlá diskusie chránia ľudí pred útokmi, no ponechávajú priestor na kritiku práce.'}),
S('Hudba na pódiu','@stage.sessions','Kapela zahrala novú pesničku na školskom koncerte.','#ffc394',[
C('tono.chord','Gitara mi pri refréne prekryla spev. Stíšil by som ju v mixe.','k','keep','Komentár opisuje konkrétnu časť a navrhuje úpravu zvuku.'),
C('bass.11','Dievčatá na takomto pódiu nemajú čo robiť.','h','flag','Útok vylučuje ľudí kvôli pohlaviu. Nehodnotí konkrétne vystúpenie.'),
C('vlny.aja','Ja by som si tento žáner nepustila.','n','keep','Nezhoda vo vkuse je v poriadku. Komentár nikoho nevylučuje.')],
{q:'Ktorá verzia je obyčajný názor na hudbu?',o:['„Tento štýl sa mi nepáči.“','„Ľudia ako vy sem nepatria.“','„Ste neschopní a mali by ste prestať.“'],ok:0,why:'Prvá veta hovorí o vkuse. Ďalšie dve smerujú proti ľuďom.'}),
S('Pokus s farbami','@skusame.vec','Farebné vrstvy v pohári. Čo sa stane po pridaní kvapky?','#72d9ca',[
C('lab.mika','Mám radšej pokusy, pri ktorých je výsledok vidieť hneď.','n','keep','Je to preferencia formátu videa, nie hodnotenie schopností autora.'),
C('vibe.88','Vysvetľuješ ako nula. A nie, smajlík z toho nespraví pochvalu.','u','warn','Slová zhadzujú človeka. Smajlík alebo poznámka „iba vtip“ nemenia obsah vety.'),
C('neo.sci','Nevidno, čo je v pohári pred pokusom. Pomohol by krátky zoznam pomôcok na začiatku.','k','keep','Žiak vysvetľuje, kde mu chýba informácia, a navrhuje, čo doplniť.')],
{q:'Autor urážky doplní „To bol len vtip“. Čo si všímaš?',o:['Počet reakcií. Ak sa niekto smeje, je to v poriadku.','Samotné slová a to, či zhadzujú človeka.','Len to, či je na konci smajlík.'],ok:1,why:'Označenie za vtip samo osebe neruší urážlivý obsah.'}),

C('clip.tom','Hlavný herec je otrasný človek. Píšem mu to pod každé video.','u','flag','Je to opakovaná osobná urážka. Nahlásenie v hre rieši opakovaný útok, hoci sa netýka skupinovej identity.'),
C('roll.n','Tomuto príbehu by som dal skôr pokojnejšiu hudbu.','n','keep','Je to odporúčanie podľa vkusu bez konkrétnej chyby či útoku na človeka.')],
{q:'Ak sa útok opakuje aj mimo tejto diskusie, čo pomôže?',o:['Odpovedať rovnakou urážkou, aby sa autor poučil.','Čakať, kým sa to stane ešte viackrát.','Povedať dôveryhodnému dospelému, čo sa deje, a ukázať mu potrebné informácie.'],ok:2,why:'Opakovaný útok nemusíš riešiť sám či sama. Dospelý môže pomôcť aj vtedy, keď nahlásenie nestačí.'})

let mode=1,idx=0,ci=null,phase='home',type='',action='',bonusChoice=null,logs=[],order=[],playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const who=()=>mode===2?idx%2+1:1;

function goTop(){window.scrollTo(0,0);}
function focusTo(sel,scroll=false){const el=app.querySelector(sel);if(el){el.setAttribute('tabindex','-1');el.focus({preventScroll:true});if(scroll)el.scrollIntoView({block:'nearest'});}}
function rulesBody(){
 return '<div class="rules-body"><ol><li>Pozri si klip. Pod ním hneď uvidíš všetky tri komentáre. Klikni na ľubovoľný z nich.</li><li>Vyber <b>typ komentára</b> a potom <b>zásah</b>. Stlač Overiť rozhodnutie a prečítaj si vysvetlenie. Správny typ a zásah sa hodnotia zvlášť.</li><li>Vybavený komentár sa označí. Na jeho vysvetlenie sa môžeš vrátiť kliknutím. Po vyriešení všetkých troch otvor krátku výzvu. Ak sa striedate, ďalšie video so všetkými jeho úlohami rieši druhý hráč.</li></ol><h3>Pravidlá našej fiktívnej diskusie</h3><ul><li><b>Ponechať:</b> názor a vecná kritika. Aj nesúhlas patrí do diskusie.</li><li><b>Upozorniť na pravidlá:</b> prvá osobná urážka. Požiadame autora, aby sa vyjadril k veci bez útoku.</li><li><b>Nahlásiť:</b> útok na skupinovú identitu (napr. pôvod, vieru, pohlavie alebo zdravotné znevýhodnenie) alebo opakovaná osobná urážka.</li></ul><p class="muted">Za každé video môžeš získať 7 bodov: 3 za určenie typu, 3 za zásah a 1 za výzvu. Nie je tu časový limit. Pri skutočnom ubližovaní môže pomôcť aj dôveryhodný dospelý.</p></div>';
}
function phone(s,demo=false){
 return `<div class="phone" aria-label="${demo?'Ukážka telefónu':'Fiktívne školské video a komentáre'}"><div class="screen">
 <div class="statusbar" aria-hidden="true"><span>9:41</span><i class="camera"></i><span>▴ ▂ ▰</span></div>
 <div class="phone-app"><span>◈ školský feed</span><span>${demo?'UKÁŽKA':'SIMULÁCIA'}</span></div>
 <div class="clip"><img id="clip-img" src="${!demo&&playing?media[idx].gif:media[idx].still}" alt="Ilustrovaný klip: ${safe(s.title)}"><span class="clip-tag">ŠKOLSKÝ KLIP</span>${demo?'':`<button class="motion" data-motion aria-pressed="${!playing}">${playing?'Pozastaviť GIF':'Spustiť GIF'}</button>`}</div>
 <div class="phone-copy"><b>${safe(s.title)}</b><p>${safe(s.caption)}</p><span class="handle">${safe(s.handle)}</span></div>
 <div class="thread" id="thread">${demo?`<div class="thread-head"><span>Komentáre</span><span>ukážka</span></div><div class="msg"><span class="avatar">N</span><div><b>nia.flip</b><p>${safe(s.comments[0].text)}</p></div></div>`:''}</div><div class="homebar" aria-hidden="true"></div></div></div>`;
}
function home(){
 idx=0;phase='home';app.style.setProperty('--accent',scenes[0].accent);
 app.innerHTML=`<div class="fade"><section class="hero"><div><div class="eyebrow">Školský feed / tvoja prvá smena</div><h1>Moderátor<em>na smene.</em></h1><p>Pod každým školským videom ťa čakajú tri komentáre. Niektoré pomáhajú, iné zhadzujú človeka. Rozhodni, čo má zostať a kedy treba zasiahnuť.</p><div class="actions"><button class="btn primary" data-start="1">Hrám sám / sama →</button><button class="btn" data-start="2">Striedame sa →</button></div><div class="stats-line"><span class="chip">10 videí</span><span class="chip">30 komentárov</span><span class="chip">10 výziev</span></div></div>
 <div class="hero-art"><div class="halo" aria-hidden="true"></div>${phone(scenes[0],true)}<div class="sticker" aria-hidden="true">TVÔJ ZÁSAH. TVOJA VOĽBA.</div></div></section>
 <details class="rules" open><summary>Ako sa hrá</summary>${rulesBody()}</details></div>`;goTop();
}
function start(m){
 mode=m;idx=0;logs=[];order=scenes.map((_,i)=> i===0?[0,1,2]:[i%3,(i+1)%3,(i+2)%3]);begin();
}
function begin(){
 ci=null;phase='round';type='';action='';bonusChoice=null;logs[idx]={player:who(),comments:[null,null,null],bonus:null};
 const s=current();app.style.setProperty('--accent',s.accent);
 app.innerHTML=`<div class="fade"><div class="toolbar"><div><p class="eyebrow">Video ${idx+1} / ${scenes.length}</p><div class="progress" aria-hidden="true">${scenes.map((_,i)=>`<i class="${i===idx?'current':i<idx?'done':''}"></i>`).join('')}</div></div>
 <div class="toolbar-right">${mode===2?`<span class="chip">Na rade: hráč ${who()}</span>`:''}<button class="btn subtle" data-rules>Pravidlá</button><button class="btn subtle" data-home>Menu</button></div></div>
 <div class="workspace">${phone(s)}<section class="desk" id="desk" aria-label="Moderátorský panel"></section></div></div>`;
 renderThread();renderDesk();goTop();focusTo('#desk h1');
}
function completed(r=log()){return r.comments.filter(Boolean).length;}
function renderThread(){
 const s=current(),r=log(),n=completed(r);
 document.querySelector('#thread').innerHTML=`<div class="thread-head"><span>Komentáre · vyber kliknutím</span><span aria-live="polite">${n} / 3 vybavené</span></div>${order[idx].map((j,i)=>{
 const c=s.comments[j],g=r.comments[i];
 return `<button type="button" class="msg comment-card ${i===ci?'current':''} ${g?'is-done':''}" data-comment="${i}" aria-pressed="${i===ci}" style="--avatar:${['#9be0cb','#e7b1ed','#f7bf85'][i]}"><span class="avatar" aria-hidden="true">${safe(c.user[0].toUpperCase())}</span><span class="comment-copy"><b>${safe(c.user)}</b><span class="comment-text">${safe(c.text)}</span><small class="${g?'done-label':'badge'}">${g?'✓ Vybavené · pozrieť vysvetlenie':'Otvoriť komentár ↗'}</small></span></button>`;
 }).join('')}${n===3?`<button class="btn primary thread-bonus" data-open-bonus>${r.bonus===null?'Otvoriť výzvu':'Vrátiť sa k výzve'} →</button>`:''}`;
}
function pickButtons(dict,data,value){
 return Object.entries(dict).map(([k,v])=>`<button class="pick" data-${data}="${k}" aria-pressed="${value===k}">${v[0]}<small>${v[1]}</small></button>`).join('');
}
function renderDesk(){

 if(ci===null){
  d.innerHTML=`<p class="eyebrow">Moderátorský panel</p><h1>Vyber komentár.</h1><p>Pod videom sú tri komentáre. Otvor ktorýkoľvek a rozhodni, aký je to typ a ako naň zareaguješ.</p><p class="tip-box">Vybavené: <b>${completed(r)}/3</b>. Už vyriešené komentáre môžeš znovu otvoriť a prečítať si vysvetlenie.</p>${completed(r)===3?'<div class="actions"><button class="btn primary" data-open-bonus>Otvoriť výzvu →</button></div>':''}`;
  return;
 }
 if(ci===s.comments.length){
  const b=s.bonus;
  d.innerHTML=`<p class="eyebrow">Doplnková úloha / 1 bod</p><h1>Výzva po videu</h1><p>${safe(b.q)}</p>
  ${r.bonus===null?`<div class="bonus-picks" role="group" aria-label="Možnosti výzvy">${b.o.map((v,i)=>`<button class="pick" data-bonus="${i}" aria-pressed="${bonusChoice===i}">${safe(v)}</button>`).join('')}</div><div class="actions"><button class="btn primary" data-check-bonus ${bonusChoice===null?'disabled':''}>Overiť výzvu</button></div>`:`<div class="feedback" id="verdict" role="status"><h2>${r.bonus===b.ok?'Správne · 1/1 bod':'Výzva · 0/1 bod'}</h2><p><b>Vhodná odpoveď:</b> ${safe(b.o[b.ok])}</p><p>${safe(b.why)}</p><p><b>Za video: ${points(r)}/7 bodov</b></p><button class="btn primary" data-next-video>${idx+1===scenes.length?'Pozrieť výsledky':mode===2?'Odovzdať zariadenie':'Ďalšie video'} →</button></div>`}`;
  return;
 }
 const c=s.comments[order[idx][ci]],g=r.comments[ci];
 d.innerHTML=`<p class="eyebrow">Moderátorský panel / komentár ${ci+1} z 3</p><h1>Čo s týmto komentárom?</h1><blockquote>${safe(c.text)}</blockquote>
 ${g?`<div class="feedback" id="verdict" role="status"><h2>${g.typeOK&&g.actionOK?'Správne rozhodnutie':'Rozbor rozhodnutia'}</h2><div class="tags"><span class="tag ${g.typeOK?'ok':''}">Typ ${+g.typeOK}/1</span><span class="tag ${g.actionOK?'ok':''}">Zásah ${+g.actionOK}/1</span></div><p><b>Tvoj výber:</b> ${kinds[g.type][0]} · ${moves[g.action][0]}</p><p><b>Odporúčané:</b> ${kinds[c.t][0]} · ${moves[c.a][0]}</p><p>${safe(c.why)}</p><div class="actions"><button class="btn" data-comments>Späť ku komentárom</button>${completed(r)===3?'<button class="btn primary" data-open-bonus>Prejsť na výzvu →</button>':''}</div></div>`:`<h2>1. Aký je to typ?</h2><div class="picks" role="group" aria-label="Typ komentára">${pickButtons(kinds,'type',type)}</div>
 <h2>2. Ako zasiahneš?</h2><div class="picks actions-pick" role="group" aria-label="Zásah moderátora">${pickButtons(moves,'action',action)}</div>
 <div class="actions"><button class="btn primary" data-check ${type&&action?'':'disabled'}>Overiť rozhodnutie</button></div><p class="helper">${type&&action?'Výber je pripravený.':'Vyber jeden typ a jeden zásah.'}</p>`}`;
}
function points(r){return r.comments.filter(Boolean).reduce((n,c)=>n+(+c.typeOK)+(+c.actionOK),0)+Number(r.bonus===scenes[logs.indexOf(r)].bonus.ok);}
function grade(){
 const r=log();if(!type||!action||ci===null||ci>=3||r.comments[ci])return;
 const c=current().comments[order[idx][ci]];
 r.comments[ci]={index:order[idx][ci],type,action,typeOK:type===c.t,actionOK:action===c.a};
 renderThread();renderDesk();focusTo('#verdict',true);
}
function openComment(i){
 if(!Number.isInteger(i)||i<0||i>=3)return;
 if(ci!==i){ci=i;type='';action='';}
 renderThread();renderDesk();focusTo('#desk h1',true);
}
function backToComments(){
 ci=null;type='';action='';renderThread();renderDesk();
 const i=log().comments.findIndex(c=>!c);
 const target=app.querySelector(i<0?'#thread [data-open-bonus]':`[data-comment="${i}"]`);
 if(target){target.focus({preventScroll:true});target.scrollIntoView({block:'nearest'});}
}
function openBonus(){
 if(completed()!==3)return;
 ci=3;renderThread();renderDesk();focusTo('#desk h1',true);
}
function advanceVideo(){
 if(log().bonus===null)return;
 idx++;
 if(idx===scenes.length){results();return;}
 if(mode===1){begin();return;}
 phase='handoff';app.innerHTML=`<section class="hand fade"><p class="eyebrow">Výmena hráčov</p><h1 class="big">Teraz hrá hráč ${who()}.</h1><p>Odovzdaj zariadenie. Ďalší hráč rozhodne o všetkých komentároch pri novom videu.</p><div class="actions"><button class="btn primary" data-resume>Otvoriť ďalšie video →</button></div></section>`;goTop();focusTo('h1');
}
function results(){
 phase='results';
 const types=logs.flatMap(r=>r.comments).filter(c=>c.typeOK).length,actions=logs.flatMap(r=>r.comments).filter(c=>c.actionOK).length,b=logs.filter((r,i)=>r.bonus===scenes[i].bonus.ok).length;
 const stats=[['Body spolu',`${types+actions+b}/70`],['Typy komentárov',`${types}/30`],['Zásahy',`${actions}/30`],['Výzvy',`${b}/10`]];
 if(mode===2)for(const p of [1,2])stats.push([`Hráč ${p} · 5 videí`,`${logs.filter(r=>r.player===p).reduce((n,r)=>n+points(r),0)}/35`]);
 app.innerHTML=`<section class="result fade"><p class="eyebrow">10 videí vybavených</p><h1 class="big">Smena skončila.</h1><p>Keď váhaš, spýtaj sa: Hovorí komentár o obsahu, alebo útočí na človeka či skupinu?</p><div class="totals">${stats.map(([name,value])=>`<div class="total"><b>${value}</b><span>${name}</span></div>`).join('')}</div>
 <h2>Prehľad rozhodnutí</h2>${logs.map((r,i)=>{const s=scenes[i];return `<details class="case-review"><summary>${i+1}. ${safe(s.title)} · ${points(r)}/7${mode===2?' · hráč '+r.player:''}</summary>${r.comments.map(g=>{const c=s.comments[g.index];return `<div class="review-row"><p><b>${safe(c.text)}</b></p><p>Tvoj výber: ${kinds[g.type][0]} · ${moves[g.action][0]}<br>Odporúčané: ${kinds[c.t][0]} · ${moves[c.a][0]}</p><p>${safe(c.why)}</p></div>`;}).join('')}<p><b>Výzva:</b> ${safe(s.bonus.q)}</p><p>Tvoja odpoveď: ${safe(s.bonus.o[r.bonus])}<br>Vhodná odpoveď: ${safe(s.bonus.o[s.bonus.ok])}</p><p>${safe(s.bonus.why)}</p></details>`;}).join('')}
 <div class="actions"><button class="btn primary" data-start="${mode}">Hrať znova</button><button class="btn" data-home>Na úvod</button></div></section>`;goTop();focusTo('h1');
}
function toggleMotion(btn){
 playing=!playing;const img=document.querySelector('#clip-img');img.src=playing?media[idx].gif:media[idx].still;btn.textContent=playing?'Pozastaviť GIF':'Spustiť GIF';btn.setAttribute('aria-pressed',String(!playing));
}
function openRules(){
 rulesDialog.innerHTML=`<h2 id="rules-title">Ako sa hrá</h2>${rulesBody()}<div class="actions"><button class="btn primary" data-close>Zavrieť</button></div>`;rulesDialog.showModal();
}
rulesDialog.addEventListener('click',e=>{if(e.target.closest('[data-close]'))rulesDialog.close();});
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if('start' in d)start(+d.start);
 else if('home' in d){if(phase!=='round'||confirm('Ukončiť smenu? Rozhraná hra sa neuloží.'))home();}
 else if('motion' in d)toggleMotion(b);
 else if('rules' in d)openRules();
 else if('resume' in d&&phase==='handoff')begin();
 else if(phase==='round'){
  if('comment' in d)openComment(+d.comment);
  else if('comments' in d)backToComments();
  else if('openBonus' in d)openBonus();
  else if('type' in d&&!log().comments[ci]){type=d.type;renderDesk();app.querySelector(`[data-type="${type}"]`).focus({preventScroll:true});}
  else if('action' in d&&!log().comments[ci]){action=d.action;renderDesk();app.querySelector(`[data-action="${action}"]`).focus({preventScroll:true});}
  else if('check' in d)grade();
  else if('bonus' in d&&ci===3&&log().bonus===null){bonusChoice=+d.bonus;renderDesk();app.querySelector(`[data-bonus="${bonusChoice}"]`).focus({preventScroll:true});}
  else if('checkBonus' in d&&ci===3&&bonusChoice!==null&&log().bonus===null){log().bonus=bonusChoice;renderDesk();focusTo('#verdict',true);}
  else if('nextVideo' in d)advanceVideo();
 }
});
home();
</script></body></html>
