 else if(b.hasAttribute("data-home")){if(!log.length||round===order.length||confirm("Vrátiť sa na úvod? Rozohraná hra sa neuloží."))home();}
 else if(b.hasAttribute("data-resume"))render(true);
 else if(b.hasAttribute("data-doc"))showDoc(+b.dataset.doc);
 else if(b.hasAttribute("data-unpin")&&!log[round]){pins.delete(+b.dataset.unpin);render(false,"[data-doc]");}
 else if(b.hasAttribute("data-verdict")&&!log[round]){selected=b.dataset.verdict;render(false,`[data-verdict="${selected}"]`);}
 else if(b.hasAttribute("data-submit"))finishRound();
 else if(b.hasAttribute("data-next"))next();
});
home();
</script>
</body>
</html>
